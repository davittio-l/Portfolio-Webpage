<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hybrid PM Dashboard</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <header style="text-align:center; padding: 40px 20px;">
    <h1>Hybrid PM Dashboard</h1>
    <p>A sample project demonstrating Hybrid planning and documentation.</p>
    <a href="../index.html" style="color:#393347; font-weight: bold;">← Back to Portfolio</a>
  </header>

  <main style="max-width: 1000px; margin: 0 auto; padding: 20px;">
    <section style="margin-bottom: 40px;">
      <h2>Gantt Chart</h2>
      <img src="../static/mock-schedule.png" alt="Sprint Schedule" style="width: 100%; max-width: 700px;" />
    </section>

    <section style="margin-bottom: 40px;">
      <h2>Sprint Planning Snapshot</h2>
      <img src="../static/mock-burndown.png" alt="Burndown Chart" style="width: 100%; max-width: 700px;" />
    </section>

    <section style="margin-bottom: 40px;">
      <h2>Milestone & Deliverable Tracker</h2>
      <img src="../static/mock-stakeholders.png" alt="Stakeholder Engagement Plan" style="width: 100%; max-width: 700px;" />
    </section>

    <section style="margin-bottom: 40px;">
      <h2>Risk Matrix</h2>
      <img src="../static/mock-risk.png" alt="Risk Register" style="width: 100%; max-width: 700px;" />
    </section>

    <section style="margin-bottom: 40px;">
      <h2>Stakeholder Map or Engagement Plan</h2>
      <img src="../static/mock-budget.png" alt="Budget Overview" style="width: 100%; max-width: 700px;" />
    </section>
  </main>
</body>
</html>
